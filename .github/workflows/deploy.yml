name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true

      - name: Notify Rocket.Chat (success)
        if: success()
        env:
          ROCKET_CHAT_WEBHOOK_URL: ${{ secrets.ROCKET_CHAT_WEBHOOK_URL }}
          MSG_TEXT: |
            ✅ *api-checker* deploy success
            • Branch: `${{ github.ref_name }}`
            • Commit: `${{ github.sha }}`
            • Author: ${{ github.actor }}
            • Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          curl -sS -X POST "$ROCKET_CHAT_WEBHOOK_URL"
          -H "Content-Type: application/json"
          -d "$(jq -n --arg text "$MSG_TEXT" --arg alias "GitHub Actions" --arg emoji ":rocket:"
          '{text: $text, alias: $alias, emoji: $emoji}')"

      - name: Notify Rocket.Chat (failure)
        if: failure()
        env:
          ROCKET_CHAT_WEBHOOK_URL: ${{ secrets.ROCKET_CHAT_WEBHOOK_URL }}
          MSG_TEXT: |
            ❌ *api-checker* deploy failed
            • Branch: `${{ github.ref_name }}`
            • Commit: `${{ github.sha }}`
            • Author: ${{ github.actor }}
            • Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          curl -sS -X POST "$ROCKET_CHAT_WEBHOOK_URL"
          -H "Content-Type: application/json"
          -d "$(jq -n --arg text "$MSG_TEXT" --arg alias "GitHub Actions" --arg emoji ":x:"
          '{text: $text, alias: $alias, emoji: $emoji}')"
